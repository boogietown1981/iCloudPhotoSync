name: iCloudPhotoSync 1.8.0 validation
on:
  push:
    branches: [main, fix/v1.8.0-stability-security]
  pull_request:

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned HTTP dependencies
        run: python -m pip install -r spk/icloudphotosync/src/requirements-pure.txt
      - name: Python syntax check
        run: python -m compileall -q spk/icloudphotosync/src
      - name: Shell syntax check
        run: bash -n build.sh && sh -n spk/icloudphotosync/src/service-setup.sh
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone Synology package
        run: bash build.sh
      - name: Verify archive contents and vendored dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -s iCloudPhotoSync-1.8.0.spk
          test "$(tar -xOf iCloudPhotoSync-1.8.0.spk INFO | grep -c 'version="1.8.0"')" -eq 1
          mkdir -p /tmp/ics-spk-check
          tar -xOf iCloudPhotoSync-1.8.0.spk package.tgz | tar -xz -C /tmp/ics-spk-check
          PYTHONPATH=/tmp/ics-spk-check/lib/vendor:/tmp/ics-spk-check/lib python -c "import requests, urllib3, config_manager; print(requests.__version__, urllib3.__version__)"
          test -f /tmp/ics-spk-check/bin/scheduler.py
      - name: Upload verified SPK
        uses: actions/upload-artifact@v4
        with:
          name: iCloudPhotoSync-1.8.0-noarch
          path: iCloudPhotoSync-1.8.0.spk
          retention-days: 30
